plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    throw new GradleException("❌ ERROR: keystore.properties file missing!")
}

android {
    namespace = "com.sashakt_nirman_app"  // Only one namespace declaration needed
    compileSdk 36  // Changed to integer instead of = 35
    ndkVersion "27.3.13750724"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId "com.sashakt_nirman_app"
        minSdkVersion 23
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.multidex:multidex:2.0.1'
//    implementation 'com.facebook.android:facebook-login:latest.release'
//    implementation 'com.google.firebase:firebase-messaging:21.1.0'
//    implementation 'com.pusher:push-notifications-android:${ANDROID_SDK_VERSION}'
    testImplementation 'junit:junit:4.12'
//    implementation 'com.pusher:push-notifications-android:1.9.0'
    implementation 'phonepe.intentsdk.android.release:IntentSDK:3.1.0'
    implementation 'com.google.firebase:firebase-auth:23.3.0'
    implementation 'com.google.firebase:firebase-bom:34.0.0'
}
